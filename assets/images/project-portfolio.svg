<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="12" fill="url(#p1Bg)" />
  <rect width="598" height="358" x="1" y="1" rx="11" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Code / Grid Accent -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,8" opacity="0.3">
    <line x1="40" y1="0" x2="40" y2="360" />
    <line x1="180" y1="0" x2="180" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="460" y1="0" x2="460" y2="360" />
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
  </g>

  <!-- Browser / Portfolio Window Mockup (Left) -->
  <g transform="translate(45, 60)">
    <rect width="230" height="230" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect width="230" height="28" rx="8" fill="#0f172a" />
    <circle cx="15" cy="14" r="4" fill="#ef4444" />
    <circle cx="27" cy="14" r="4" fill="#f59e0b" />
    <circle cx="39" cy="14" r="4" fill="#10b981" />
    <rect x="55" y="7" width="120" height="14" rx="4" fill="#1e293b" />
    <text x="115" y="18" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">portfolio.local</text>
    
    <!-- Hero Mock Inside Browser -->
    <rect x="15" y="45" width="100" height="12" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="15" y="65" width="190" height="6" rx="2" fill="#64748b" />
    <rect x="15" y="77" width="150" height="6" rx="2" fill="#64748b" />
    <rect x="15" y="95" width="50" height="16" rx="4" fill="#818cf8" />
    
    <!-- Skill Grid mockup -->
    <rect x="15" y="130" width="90" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="115" y="130" width="90" height="40" rx="4" fill="#0f172a" stroke="#334155" />
    <rect x="15" y="180" width="190" height="35" rx="4" fill="#0f172a" stroke="#334155" />
  </g>

  <!-- Deployment Arrow -->
  <g transform="translate(290, 165)">
    <path d="M 0,0 L 40,0" stroke="url(#flowGrad)" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="40,-6 52,0 40,6" fill="#818cf8" />
    <text x="25" y="-12" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold">HTTP / Nginx</text>
  </g>

  <!-- Cloud / Server Box (Right) -->
  <g transform="translate(360, 60)">
    <rect width="195" height="230" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Header -->
    <rect width="195" height="32" rx="8" fill="#1e293b" />
    <text x="15" y="21" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="bold">AWS EC2 (Ubuntu)</text>
    <circle cx="175" cy="16" r="4" fill="#10b981" />

    <!-- Terminal/Daemon Output inside Server -->
    <rect x="12" y="44" width="171" height="90" rx="4" fill="#030712" />
    <text x="20" y="62" fill="#10b981" font-size="9" font-family="monospace">$ systemctl status nginx</text>
    <text x="20" y="78" fill="#e2e8f0" font-size="9" font-family="monospace">● nginx.service - active</text>
    <text x="20" y="94" fill="#94a3b8" font-size="8" font-family="monospace">Port 80/443 listening</text>
    <text x="20" y="110" fill="#38bdf8" font-size="8" font-family="monospace">root: /var/www/portfolio</text>
    <text x="20" y="126" fill="#a855f7" font-size="8" font-family="monospace">Status: 200 OK</text>

    <!-- Nginx Proxy Box -->
    <rect x="12" y="146" width="171" height="65" rx="4" fill="#1f2937" stroke="#374151" />
    <text x="20" y="166" fill="#f59e0b" font-size="10" font-family="monospace" font-weight="bold">NGINX REVERSE PROXY</text>
    <text x="20" y="184" fill="#9ca3af" font-size="9" font-family="monospace">Gzip: On | SSL Ready</text>
    <text x="20" y="199" fill="#9ca3af" font-size="9" font-family="monospace">Cache-Control: public</text>
  </g>
</svg>
