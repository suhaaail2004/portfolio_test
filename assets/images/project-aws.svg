<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#e68a00" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#p3Bg)" />
  <rect width="598" height="358" x="1" y="1" rx="11" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Outer VPC Container -->
  <rect x="30" y="30" width="540" height="300" rx="10" fill="none" stroke="#ff9900" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="45" y="20" width="160" height="22" rx="4" fill="#1e293b" stroke="#ff9900" stroke-width="1" />
  <text x="125" y="35" text-anchor="middle" fill="#ff9900" font-size="10" font-family="sans-serif" font-weight="bold">AWS VPC: 10.0.0.0/16</text>

  <!-- Security Group Perimeter -->
  <rect x="60" y="65" width="480" height="245" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />
  <text x="75" y="88" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="bold">SECURITY GROUP: sg-web-production</text>
  
  <!-- Security Rules Pills -->
  <g transform="translate(320, 75)" font-family="monospace" font-size="9">
    <rect x="0" y="0" width="65" height="18" rx="4" fill="#1e293b" stroke="#10b981" />
    <text x="32" y="12" text-anchor="middle" fill="#10b981">HTTP :80</text>
    <rect x="75" y="0" width="70" height="18" rx="4" fill="#1e293b" stroke="#10b981" />
    <text x="110" y="12" text-anchor="middle" fill="#10b981">HTTPS :443</text>
    <rect x="155" y="0" width="60" height="18" rx="4" fill="#1e293b" stroke="#f59e0b" />
    <text x="185" y="12" text-anchor="middle" fill="#f59e0b">SSH :22</text>
  </g>

  <!-- Left: EC2 Instance Node -->
  <g transform="translate(85, 115)">
    <rect width="210" height="175" rx="8" fill="#111827" stroke="#ff9900" stroke-width="2" />
    <rect width="210" height="30" rx="8" fill="#1f2937" />
    <text x="15" y="20" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">Amazon EC2 (t3.micro)</text>
    <circle cx="190" cy="15" r="4" fill="#10b981" />

    <g font-family="monospace" font-size="9" fill="#94a3b8">
      <text x="15" y="55">OS: Ubuntu 22.04 LTS</text>
      <text x="15" y="75">Public IP: 54.x.x.x (Elastic)</text>
      <text x="15" y="95">Subnet: Public Subnet A</text>
      <text x="15" y="115">Role: Nginx Web Server</text>
    </g>

    <!-- EBS Volume Attached -->
    <rect x="15" y="130" width="180" height="30" rx="4" fill="#1e293b" stroke="#ff9900" stroke-width="1" />
    <text x="25" y="149" fill="#ff9900" font-size="9" font-family="sans-serif" font-weight="bold">EBS: 20GB gp3 root volume</text>
  </g>

  <!-- Middle Connection -->
  <g transform="translate(315, 190)">
    <path d="M 0,0 L 45,0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="45,-5 55,0 45,5" fill="#38bdf8" />
  </g>

  <!-- Right: Git & Nginx Deployment Automation -->
  <g transform="translate(385, 115)">
    <rect width="135" height="80" rx="6" fill="#111827" stroke="#818cf8" stroke-width="1.5" />
    <text x="12" y="25" fill="#818cf8" font-size="10" font-family="sans-serif" font-weight="bold">Git Deployment</text>
    <text x="12" y="45" fill="#cbd5e1" font-size="9" font-family="monospace">git clone &amp; pull</text>
    <text x="12" y="65" fill="#10b981" font-size="8" font-family="monospace">Webhook Trigger</text>

    <rect y="95" width="135" height="80" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <text x="12" y="120" fill="#10b981" font-size="10" font-family="sans-serif" font-weight="bold">Nginx Service</text>
    <text x="12" y="140" fill="#cbd5e1" font-size="9" font-family="monospace">Static Server</text>
    <text x="12" y="160" fill="#38bdf8" font-size="8" font-family="monospace">Zero Downtime</text>
  </g>
</svg>
