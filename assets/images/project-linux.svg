<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="terminalHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#p2Bg)" />
  <rect width="598" height="358" x="1" y="1" rx="11" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Terminal Window Shell -->
  <g transform="translate(40, 30)">
    <rect width="520" height="300" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title bar -->
    <rect width="520" height="36" rx="10" fill="url(#terminalHeader)" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="260" y="23" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="'Courier New', monospace" font-weight="bold">
      root@rhel9-admin-lab:~ (RHCSA Lab Environment)
    </text>

    <!-- Terminal Content Area -->
    <g font-family="'Courier New', monospace" font-size="11" xml:space="preserve">
      <!-- Line 1: User & Permissions -->
      <text x="20" y="65" fill="#38bdf8"># id devops_admin &amp;&amp; ls -ld /var/storage/secure</text>
      <text x="20" y="82" fill="#94a3b8">uid=1001(devops_admin) gid=1001(sysops) groups=1001(sysops),10(wheel)</text>
      <text x="20" y="99" fill="#e2e8f0">drwxr-x---. 4 devops_admin sysops 4096 Oct 12 12:00 /var/storage/secure</text>

      <!-- Line 2: Storage & LVM -->
      <text x="20" y="128" fill="#38bdf8"># lvs --units m &amp;&amp; vgs</text>
      <text x="20" y="145" fill="#10b981">LV        VG       Attr       LSize   Pool Origin Data%  Meta%  Move Log</text>
      <text x="20" y="162" fill="#cbd5e1">lv_app    rhel_vg  -wi-ao---- 20480.00m                        </text>
      <text x="20" y="179" fill="#cbd5e1">lv_logs   rhel_vg  -wi-ao---- 10240.00m                        </text>

      <!-- Line 3: Systemd & Automation -->
      <text x="20" y="208" fill="#38bdf8"># systemctl is-active backup-cron.timer firewalld</text>
      <text x="20" y="225" fill="#10b981">● active (running) - backup-cron.timer [Triggered daily 02:00:00 UTC]</text>
      <text x="20" y="242" fill="#10b981">● active (running) - firewalld.service [Default zone: public (ssh, http)]</text>

      <!-- Prompt Line -->
      <text x="20" y="275" fill="#a855f7">suhail@rhel9:~$ </text>
      <text x="145" y="275" fill="#e2e8f0">echo "System hardened &amp; compliant" </text>
      <rect x="380" y="264" width="8" height="14" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
