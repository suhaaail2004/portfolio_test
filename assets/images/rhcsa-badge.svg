<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="rhRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Hexagonal / Shield Outer Contour -->
  <polygon points="250,20 450,135 450,365 250,480 50,365 50,135" 
           fill="url(#rhBg)" stroke="url(#goldBorder)" stroke-width="6" />

  <!-- Inner Inset Shield -->
  <polygon points="250,38 432,143 432,357 250,462 68,357 68,143" 
           fill="#111827" stroke="#374151" stroke-width="2" />

  <!-- Red Accent Top Bar / Header Ribbon -->
  <path d="M 68,143 L 250,38 L 432,143 L 432,190 L 250,110 L 68,190 Z" 
        fill="url(#rhRedGrad)" />

  <!-- Fedora / Red Hat Stylized Silhouette -->
  <g transform="translate(250, 150) scale(1.1)">
    <!-- Hat Brim -->
    <path d="M -90,15 C -40,-5 40,-5 90,15 C 60,35 -60,35 -90,15 Z" fill="#ffffff" />
    <!-- Hat Crown -->
    <path d="M -55,10 C -50,-35 -30,-48 0,-48 C 30,-48 50,-35 55,10 C 25,5 -25,5 -55,10 Z" fill="url(#rhRedGrad)" />
    <!-- Hat Ribbon -->
    <path d="M -52,6 C -20,2 20,2 52,6 C 45,15 -45,15 -52,6 Z" fill="#18181b" />
  </g>

  <!-- Certification Title Text -->
  <text x="250" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" font-size="34" fill="#ffffff" letter-spacing="3">
    RED HAT
  </text>
  
  <text x="250" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" font-size="20" fill="#e2e8f0" letter-spacing="1.5">
    CERTIFIED
  </text>
  
  <text x="250" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" font-size="24" fill="#f87171" letter-spacing="1">
    SYSTEM ADMINISTRATOR
  </text>

  <!-- Acronym & Star Badges -->
  <rect x="180" y="355" width="140" height="42" rx="8" fill="#1f2937" stroke="#dc2626" stroke-width="2" />
  <text x="250" y="384" text-anchor="middle" font-family="'Courier New', monospace" 
        font-weight="900" font-size="26" fill="#ffffff" letter-spacing="4">
    RHCSA
  </text>

  <!-- Stars -->
  <g fill="#fbbf24">
    <circle cx="155" cy="376" r="5" />
    <circle cx="345" cy="376" r="5" />
  </g>

  <text x="250" y="435" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="1">
    ENTERPRISE LINUX
  </text>
</svg>
